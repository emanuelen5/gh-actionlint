name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cli/gh-extension-precompile@5c97d245f74e0f4447700ce0f894f1f518ffbd2a # v2.2.0
        with:
          go_version_file: go.mod
        env:
          CGO_ENABLED: 0
